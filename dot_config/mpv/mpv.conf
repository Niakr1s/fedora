osd-font="Liberation Sans"
sub-font="Liberation Sans"

window-scale=0.5
# scale=ewa_lanczos4sharpest # too tough for laptop
scale=bilinear # ewa_lanczos4sharpest # lanczos is too tough for laptop
save-position-on-quit=yes
save-watch-history=yes
watch-later-options-remove=sub-pos
slang=en
fullscreen=yes
border=no
# sub-font-size=33
osd-font-size=33
autofit-larger=75%
sub-delay=1
title=${filename}

hwdec=auto
vo=gpu-next
gpu-api=opengl
target-colorspace-hint=yes

glsl-shaders="~~/shaders/FSR.glsl"
