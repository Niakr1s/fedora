window-scale=1.0
geometry=1024x576+50%+50%
autofit-larger=1280x720
title=${filename}
border=no

# fonts
# sub-font-size=33
osd-font-size=33
osd-font="Liberation Sans"
sub-font="Liberation Sans"

scale=bilinear # ewa_lanczos4sharpest # lanczos is too tough for laptop

save-position-on-quit=yes
save-watch-history=yes
watch-later-options-remove=sub-pos

# subs
slang=en
sub-delay=1
sub-auto=all
sub-file-paths=ass:ASS:srt:SRT:sub:Sub:SUB:subs:Subs:SUBS:subtitles:Subtitles:SUBTITLES:Rus:RUS:rus:Eng:ENG:eng:Subs/*:Subtitles/*

# output
hwdec=auto
vo=gpu-next
gpu-api=opengl
target-colorspace-hint=yes

#shaders
glsl-shaders="~~/shaders/FSR.glsl"
